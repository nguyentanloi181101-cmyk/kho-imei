<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tính công</title>
  <script src="gs.js"></script>
  <script>window.google = { script: { run: HUB.run('cong') } };</script>
  <style>
    :root {
      --bg: #f4f6f8; --card: #ffffff; --ink: #1c252e; --mut: #637381;
      --line: #dfe3e8; --pri: #1f6b4a; --neg: #b3392b; --pos: #1f6b4a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, sans-serif; font-size: 15px; }
    main { max-width: 600px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .head-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .status { font-size: 12px; color: var(--mut); }
    .select-group { display: flex; gap: 8px; margin-bottom: 12px; }
    select, input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font: inherit; }
    .emps { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
    .chip { padding: 6px 12px; border: 1px solid var(--line); border-radius: 16px; background: #fff; font-size: 14px; }
    .chip.on { background: var(--pri); color: #fff; border-color: var(--pri); }
    nav { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; }
    nav button { flex: none; padding: 8px 12px; border: 1px solid var(--line); border-radius: 16px; background: #fff; cursor: pointer; }
    nav button.on { background: var(--pri); color: #fff; border-color: var(--pri); }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .card h2 { font-size: 15px; margin: 0 0 8px; }
    .row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
    .row:last-child { border: 0; }
    .tot { font-size: 24px; font-weight: bold; color: var(--pri); margin-top: 4px; }
    .btn-sm { padding: 6px 12px; border: 0; border-radius: 6px; background: var(--pri); color: #fff; cursor: pointer; font-weight: bold; }
    .btn-sm:disabled { opacity: .6; cursor: default; }
    .btn-out { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; color: var(--neg); font-size: 13px; }
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
    .dh { text-align: center; font-size: 12px; color: var(--mut); }
    .day { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 6px; background: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .day.off { background: var(--neg); color: #fff; border-color: var(--neg); }
    .day.fut { opacity: .35; }
    .pos { color: var(--pos); } .neg { color: var(--neg); } .mut { color: var(--mut); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; color: var(--mut); margin-bottom: 4px; }
    .msg { margin-top: 8px; font-size: 14px; min-height: 18px; }
    .login-wrap { margin-top: 24px; }
    .add-row { display: flex; gap: 6px; }
  </style>
</head>
<body>
<main>
  <div id="loginBox" class="login-wrap" style="display:none;"></div>

  <div id="app" style="display:none;">
    <div class="head-bar">
      <h1>Tính công</h1>
      <div>
        <span id="st" class="status"></span>
        <button onclick="loadCloud()" style="border:0;background:none;color:var(--pri);cursor:pointer;">🔄 Tải lại</button>
      </div>
    </div>

    <div class="select-group">
      <select id="mSel" onchange="syncM()"></select>
      <select id="ySel" onchange="syncM()"></select>
    </div>

    <div id="emps" class="emps"></div>
    <nav id="tabs"></nav>
    <div id="view"></div>
  </div>
</main>

<script>
  var $ = function (s) { return document.querySelector(s); };
  var fmt = function (n) { return (Math.round(n) || 0).toLocaleString('vi-VN') + ' đ'; };
  var norm = function (s) { return String(s || '').normalize('NFC').replace(/\s+/g, ' ').trim().toLowerCase(); };
  var sameEmp = function (a, b) { return norm(a) === norm(b); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  var hasGS = function () { return !!(window.google && google.script && google.script.run); };

  var TABS = [['sum', 'Tổng hợp'], ['cc', 'Chấm công'], ['kpi', 'KPI'], ['models', 'Model bán'], ['plus', 'Thưởng / Chi bù'], ['minus', 'Các khoản trừ']];

  var db = {}, tab = 'sum', dt = [], offSheet = [], adjSheet = [], paidSheet = [];
  var curEmp = '', curMonth = '', token = '';

  /* ================= KHỞI TẠO ================= */

  function init() {
    var now = new Date();
    var mHTML = '', yHTML = '';
    for (var i = 1; i <= 12; i++) {
      mHTML += '<option value="' + i + '"' + (i === now.getMonth() + 1 ? ' selected' : '') + '>Tháng ' + i + '</option>';
    }
    for (var y = now.getFullYear() - 2; y <= now.getFullYear() + 2; y++) {
      yHTML += '<option value="' + y + '"' + (y === now.getFullYear() ? ' selected' : '') + '>Năm ' + y + '</option>';
    }
    $('#mSel').innerHTML = mHTML;
    $('#ySel').innerHTML = yHTML;
    syncM();

    try {
      token = sessionStorage.getItem('tc_token') || '';
      curEmp = sessionStorage.getItem('tc_emp') || '';
    } catch (e) { token = ''; curEmp = ''; }

    if (token && curEmp) {
      showApp();
      loadCloud();
    } else {
      showLogin();
    }
  }

  function syncM() {
    var m = Number($('#mSel').value);
    var y = $('#ySel').value;
    curMonth = y + '-' + (m < 10 ? '0' + m : m);
    if (token) render();
  }

  /* ================= ĐĂNG NHẬP / ĐĂNG XUẤT ================= */

  function showLogin(msg) {
    token = ''; curEmp = '';
    db = {}; dt = []; offSheet = []; adjSheet = []; paidSheet = [];
    try { sessionStorage.removeItem('tc_token'); sessionStorage.removeItem('tc_emp'); } catch (e) {}

    $('#app').style.display = 'none';
    $('#loginBox').style.display = 'block';
    $('#loginBox').innerHTML = '<h1>Tính công</h1><div class="card mut">Đang tải danh sách nhân viên...</div>';

    if (hasGS()) {
      google.script.run
        .withSuccessHandler(function (names) { renderLogin(names || [], msg, ''); })
        .withFailureHandler(function (e) { renderLogin([], 'Lỗi tải danh sách nhân viên: ' + (e && e.message ? e.message : e), ''); })
        .getEmployeeList();
    } else {
      renderLogin([], msg, '');
    }
  }

  function renderLogin(names, msg, keepName) {
    var opts = '<option value="">-- Chọn tên --</option>';
    names.forEach(function (n) {
      opts += '<option value="' + esc(n) + '"' + (n === keepName ? ' selected' : '') + '>' + esc(n) + '</option>';
    });

    $('#loginBox').innerHTML =
      '<h1>Tính công</h1>' +
      '<div class="card">' +
        '<h2>Đăng nhập</h2>' +
        '<div class="form-group"><label>Chọn tên</label>' +
          '<select id="loginName">' + opts + '</select></div>' +
        '<div class="form-group"><label>Mật khẩu</label>' +
          '<input type="password" id="loginPass" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doLogin()"></div>' +
        '<button id="loginBtn" class="btn-sm" style="width:100%;padding:12px;font-size:16px;" onclick="doLogin()">Vào</button>' +
        '<div id="loginMsg" class="msg neg">' + esc(msg || '') + '</div>' +
      '</div>' +
      '<div class="card">' +
        '<h2>Thêm nhân viên</h2>' +
        '<div class="add-row">' +
          '<input type="text" id="newEmpName" placeholder="Tên NV mới" onkeydown="if(event.key===\'Enter\')addEmp()">' +
          '<button class="btn-sm" onclick="addEmp()">Thêm</button>' +
        '</div>' +
        '<div id="addMsg" class="msg"></div>' +
        '<p class="mut" style="font-size:13px;margin:6px 0 0;">Mật khẩu do cấp trên đặt trong Google Sheet. Nhân viên mới chỉ vào được sau khi có mật khẩu.</p>' +
      '</div>';
  }

  function doLogin() {
    var name = $('#loginName').value;
    var pass = $('#loginPass').value;
    var msg = $('#loginMsg');

    if (!name) { msg.textContent = 'Vui lòng chọn tên!'; return; }
    if (!pass) { msg.textContent = 'Vui lòng nhập mật khẩu!'; return; }
    if (!hasGS()) { msg.textContent = 'Không kết nối được Google Script.'; return; }

    var btn = $('#loginBtn');
    btn.disabled = true;
    msg.className = 'msg mut';
    msg.textContent = 'Đang kiểm tra...';

    google.script.run
      .withSuccessHandler(function (res) {
        var r = {};
        try { r = JSON.parse(res); } catch (e) {}
        if (r.ok) {
          token = r.token;
          curEmp = r.name;
          try { sessionStorage.setItem('tc_token', token); sessionStorage.setItem('tc_emp', curEmp); } catch (e) {}
          tab = 'sum';
          showApp();
          loadCloud();
        } else {
          btn.disabled = false;
          msg.className = 'msg neg';
          msg.textContent = r.msg || 'Đăng nhập thất bại.';
          $('#loginPass').value = '';
        }
      })
      .withFailureHandler(function (e) {
        btn.disabled = false;
        msg.className = 'msg neg';
        msg.textContent = 'Lỗi: ' + (e && e.message ? e.message : e);
      })
      .login(name, pass);
  }

  function addEmp() {
    var val = $('#newEmpName').value.trim();
    var msg = $('#addMsg');
    if (!val) { msg.className = 'msg neg'; msg.textContent = 'Vui lòng nhập tên!'; return; }
    if (!hasGS()) { msg.className = 'msg neg'; msg.textContent = 'Không kết nối được Google Script.'; return; }

    msg.className = 'msg mut';
    msg.textContent = 'Đang thêm...';

    google.script.run
      .withSuccessHandler(function (res) {
        if (res === 'OK') {
          google.script.run
            .withSuccessHandler(function (names) {
              renderLogin(names || [], '', val);
              $('#addMsg').className = 'msg pos';
              $('#addMsg').textContent = 'Đã thêm "' + val + '". Nhờ cấp trên đặt mật khẩu trong Sheet để đăng nhập.';
            })
            .getEmployeeList();
        } else {
          msg.className = 'msg neg';
          msg.textContent = res;
        }
      })
      .withFailureHandler(function (e) {
        msg.className = 'msg neg';
        msg.textContent = 'Lỗi: ' + (e && e.message ? e.message : e);
      })
      .addEmployee(val);
  }

  function showApp() {
    $('#loginBox').style.display = 'none';
    $('#app').style.display = 'block';
    render();
  }

  function logout(msg) {
    var t = token;
    if (t && hasGS()) { google.script.run.logout(t); }
    showLogin(typeof msg === 'string' ? msg : '');
  }

  function handleAuth(res) {
    if (res === 'AUTH') {
      logout('Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.');
      return true;
    }
    return false;
  }

  /* ================= ĐỒNG BỘ DỮ LIỆU ================= */

  function pushCloud() {
    if (hasGS() && token) {
      $('#st').textContent = 'Đang lưu...';
      google.script.run
        .withSuccessHandler(function (res) {
          if (handleAuth(res)) return;
          $('#st').textContent = 'Đã lưu';
        })
        .withFailureHandler(function () { $('#st').textContent = 'Lỗi lưu'; })
        .saveData(token, JSON.stringify({ db: db }));
    }
  }

  function loadCloud() {
    if (!token) return;
    if (hasGS()) {
      $('#st').textContent = 'Đang tải...';
      google.script.run
        .withSuccessHandler(function (res) {
          var data = {};
          try { data = JSON.parse(res || '{}'); } catch (e) {}
          if (data.error === 'AUTH') { handleAuth('AUTH'); return; }
          if (data.db) db = data.db;
          dt = data.dt || [];
          offSheet = data.offSheet || [];
          adjSheet = data.adjSheet || [];
          paidSheet = data.paidSheet || [];
          $('#st').textContent = 'Đã đồng bộ';
          render();
        })
        .withFailureHandler(function () {
          $('#st').textContent = 'Lỗi tải';
          render();
        })
        .getData(token);
    } else {
      render();
    }
  }

  /* ================= TÍNH TOÁN ================= */

  function key() { return curEmp + '|' + curMonth; }

  function rec() {
    if (!curEmp) return null;
    if (!db[key()]) {
      db[key()] = { cc: { std: 24, lcb: 5500000, cv: 500000 } };
    }
    var r = db[key()];
    r.cc = r.cc || { std: 24, lcb: 5500000, cv: 500000 };
    return r;
  }

  function setCfg(field, val) {
    var r = rec();
    if (!r) return;
    r.cc[field] = Number(val) || 0;
    pushCloud();
    render();
  }

  // Tháng cũ = cả tháng, tháng này = đến hôm nay, tháng sau = 0
  function lastCountedDay() {
    var p = curMonth.split('-');
    var y = Number(p[0]), m = Number(p[1]);
    var numDays = new Date(y, m, 0).getDate();
    var now = new Date();
    var sel = y * 12 + m, cur = now.getFullYear() * 12 + (now.getMonth() + 1);
    if (sel < cur) return numDays;
    if (sel === cur) return Math.min(now.getDate(), numDays);
    return 0;
  }

  function getEmpOffDays() {
    var days = {};
    offSheet.forEach(function (o) {
      if (o.month === curMonth && curEmp && sameEmp(o.emp, curEmp)) {
        days[o.day] = true;
      }
    });
    return days;
  }

  function getEmpKPIs() {
    return dt.filter(function (d) {
      return d.month === curMonth && curEmp && sameEmp(d.emp, curEmp);
    });
  }

  function calcSheetKPI() {
    var total = 0;
    getEmpKPIs().forEach(function (item) {
      total += (Number(item.kpi) || 0);
    });
    return total;
  }

  // Gom các model giống nhau, cộng số lượng (không tính tiền)
  function getModelSummary() {
    var map = {};
    var order = [];
    getEmpKPIs().forEach(function (item) {
      var name = String(item.model || '').trim();
      if (!name) return;
      var k = norm(name);
      if (!map[k]) {
        map[k] = { model: name, qty: 0 };
        order.push(k);
      }
      map[k].qty += Number(item.qty) || 1;
    });
    var list = order.map(function (k) { return map[k]; });
    list.sort(function (a, b) { return b.qty - a.qty || a.model.localeCompare(b.model); });
    return list;
  }

  function calcSheetAdj() {
    var bonus = 0, bu = 0, tru = 0;
    adjSheet.forEach(function (item) {
      if (item.month === curMonth && curEmp && sameEmp(item.emp, curEmp)) {
        if (item.type === 'th') bonus += Number(item.amt) || 0;
        else if (item.type === 'bu') bu += Number(item.amt) || 0;
        else if (item.type === 'tru') tru += Number(item.amt) || 0;
      }
    });
    return { bonus: bonus, bu: bu, tru: tru };
  }

  function calcSheetPaid() {
    var items = [];
    var total = 0;
    paidSheet.forEach(function (item) {
      if (item.month === curMonth && curEmp && sameEmp(item.emp, curEmp)) {
        items.push(item);
        total += (Number(item.amt) || 0);
      }
    });
    return { items: items, total: total };
  }

  function calc(r) {
    if (!r) return { luong: 0, cv: 0, kpi: 0, bonus: 0, bu: 0, tru: 0, net: 0, cong: 0, std: 24 };
    var c = r.cc;
    var std = Number(c.std) || 24;
    var lcb = Number(c.lcb) || 0;

    var last = lastCountedDay();
    var offDays = getEmpOffDays();
    var offCount = 0;
    Object.keys(offDays).forEach(function (d) { if (Number(d) <= last) offCount++; });
    var cong = Math.max(0, last - offCount);

    var luong = (cong >= std) ? lcb : (lcb / std) * cong;
    var cv = cong >= std ? (Number(c.cv) || 0) : 0;

    var totalKPI = calcSheetKPI();
    var adj = calcSheetAdj();

    return {
      luong: luong, cv: cv, kpi: totalKPI, bonus: adj.bonus, bu: adj.bu, tru: adj.tru,
      net: luong + cv + totalKPI + adj.bonus + adj.bu - adj.tru,
      cong: cong, std: std
    };
  }

  /* ================= GIAO DIỆN ================= */

  function renderEmps() {
    $('#emps').innerHTML =
      '<span class="chip on">👤 ' + esc(curEmp) + '</span>' +
      '<button class="btn-out" onclick="logout()">Đăng xuất</button>';
  }

  function renderTabs() {
    var h = '';
    TABS.forEach(function (t) {
      h += '<button class="' + (t[0] === tab ? 'on' : '') + '" onclick="tab=\'' + t[0] + '\';render();">' + t[1] + '</button>';
    });
    $('#tabs').innerHTML = h;
  }

  function renderView() {
    var v = $('#view');

    if (!curEmp) {
      v.innerHTML = '';
      return;
    }

    var r = rec();
    var t = calc(r);

    if (tab === 'sum') {
      var paidData = calcSheetPaid();
      var paysList = '';

      paidData.items.forEach(function (p) {
        paysList += '<div class="row"><span>' + esc(p.note ? p.note : 'Đã nhận') + '</span><b>' + fmt(p.amt) + '</b></div>';
      });

      var debt = t.net - paidData.total;

      v.innerHTML =
        '<div class="card">' +
          '<div class="mut">Tổng thực nhận: ' + esc(curEmp) + ' (' + curMonth + ')</div>' +
          '<div class="tot">' + fmt(t.net) + '</div>' +
        '</div>' +
        '<div class="card">' +
          '<h2>Chi tiết lương (Google Sheet)</h2>' +
          '<div class="row"><span>Lương công (' + t.cong + '/' + t.std + ')</span><b>' + fmt(t.luong) + '</b></div>' +
          '<div class="row"><span>Chuyên cần</span><b class="pos">+' + fmt(t.cv) + '</b></div>' +
          '<div class="row"><span>Thưởng KPI</span><b class="pos">+' + fmt(t.kpi) + '</b></div>' +
          '<div class="row"><span>Thưởng thêm</span><b class="pos">+' + fmt(t.bonus) + '</b></div>' +
          '<div class="row"><span>Chi bù</span><b class="pos">+' + fmt(t.bu) + '</b></div>' +
          '<div class="row"><span>Các khoản trừ</span><b class="neg">−' + fmt(t.tru) + '</b></div>' +
        '</div>' +
        '<div class="card">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
            '<h2>Đã nhận tiền (Sheet Đã nhận tiền)</h2>' +
            '<button class="btn-sm" onclick="loadCloud()">🔄 Đồng bộ</button>' +
          '</div>' +
          (paysList || '<p class="mut">Chưa có dữ liệu đã nhận tiền trên Google Sheet.</p>') +
          '<div class="row" style="margin-top:8px;font-weight:bold;border-top:1px solid var(--line);padding-top:8px;">' +
            '<span>' + (debt > 0 ? 'Còn nợ' : 'Còn dư') + '</span>' +
            '<b class="' + (debt > 0 ? 'neg' : 'pos') + '">' + fmt(Math.abs(debt)) + '</b>' +
          '</div>' +
        '</div>';
    }

    if (tab === 'cc') {
      var parts = curMonth.split('-');
      var numDays = new Date(parts[0], parts[1], 0).getDate();
      var firstDay = (new Date(parts[0], parts[1] - 1, 1).getDay() + 6) % 7;

      var offDays = getEmpOffDays();
      var grid = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map(function (d) { return '<div class="dh">' + d + '</div>'; }).join('');
      for (var i = 0; i < firstDay; i++) grid += '<div></div>';

      for (var d = 1; d <= numDays; d++) {
        grid += '<div class="day ' + (offDays[d] ? 'off' : '') + (d > lastCountedDay() ? ' fut' : '') + '"><b>' + d + '</b></div>';
      }

      v.innerHTML =
        '<div class="card">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
            '<b>Lịch nghỉ phép (Sheet Nghỉ phép)</b>' +
            '<button class="btn-sm" onclick="loadCloud()">🔄 Đồng bộ</button>' +
          '</div>' +
          '<div class="cal">' + grid + '</div>' +
        '</div>' +
        '<div class="card">' +
          '<h2>Cấu hình lương</h2>' +
          '<label class="mut">Công chuẩn (ngày)</label>' +
          '<input type="number" value="' + r.cc.std + '" onchange="setCfg(\'std\', this.value)" style="margin-bottom:8px;">' +
          '<label class="mut">Lương cơ bản (đ)</label>' +
          '<input type="number" value="' + r.cc.lcb + '" onchange="setCfg(\'lcb\', this.value)" style="margin-bottom:8px;">' +
          '<label class="mut">Chuyên cần (đ)</label>' +
          '<input type="number" value="' + r.cc.cv + '" onchange="setCfg(\'cv\', this.value)">' +
        '</div>';
    }

    if (tab === 'kpi') {
      var sheetList = '', totalKPI = 0;
      var kpiMonth = curMonth.split('-')[1];
      getEmpKPIs().forEach(function (x) {
        var k = Number(x.kpi) || 0;
        totalKPI += k;
        var dayLbl = x.day ? (String(x.day).padStart(2, '0') + '/' + kpiMonth) : '';
        sheetList += '<div class="row"><span>' + esc(x.model) + ' (x' + x.qty + ')' +
          (dayLbl ? '<br><small class="mut">Ngày bán: ' + dayLbl + '</small>' : '') +
          '</span><b class="pos">+' + fmt(k) + '</b></div>';
      });
      if (sheetList) {
        sheetList += '<div class="row" style="font-weight:bold;border-top:1px solid var(--line);margin-top:4px;padding-top:8px;"><span>Tổng KPI</span><b class="pos">+' + fmt(totalKPI) + '</b></div>';
      }

      v.innerHTML =
        '<div class="card">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
            '<h2>Danh sách Bán hàng / KPI (' + esc(curEmp) + ')</h2>' +
            '<button class="btn-sm" onclick="loadCloud()">🔄 Tải lại</button>' +
          '</div>' +
          (sheetList || '<p class="mut">Không tìm thấy dữ liệu bán hàng từ Sheet cho ' + esc(curEmp) + ' trong tháng này.</p>') +
        '</div>';
    }

    if (tab === 'models') {
      var summary = getModelSummary();
      var totalQty = 0;
      var mList = '';
      summary.forEach(function (s) {
        totalQty += s.qty;
        mList += '<div class="row"><span>' + esc(s.model) + '</span><b>x' + s.qty + '</b></div>';
      });
      if (mList) {
        mList += '<div class="row" style="font-weight:bold;border-top:1px solid var(--line);margin-top:4px;padding-top:8px;"><span>Tổng số máy</span><b>' + totalQty + '</b></div>';
      }

      v.innerHTML =
        '<div class="card">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
            '<h2>Model đã bán (' + esc(curEmp) + ')</h2>' +
            '<button class="btn-sm" onclick="loadCloud()">🔄 Tải lại</button>' +
          '</div>' +
          (mList || '<p class="mut">Không có dữ liệu bán hàng cho ' + esc(curEmp) + ' trong tháng này.</p>') +
        '</div>';
    }

    if (tab === 'plus' || tab === 'minus') {
      var isPlus = tab === 'plus';
      var filtered = adjSheet.filter(function (a) {
        var isTargetType = isPlus ? (a.type === 'th' || a.type === 'bu') : (a.type === 'tru');
        return isTargetType && a.month === curMonth && curEmp && sameEmp(a.emp, curEmp);
      });

      var list = '';
      filtered.forEach(function (a) {
        var typeName = a.type === 'th' ? 'Thưởng' : (a.type === 'bu' ? 'Chi bù' : 'Trừ tiền');
        list += '<div class="row"><span><b>[' + typeName + ']</b> ' + esc(a.note || 'Không có ghi chú') + '</span><b class="' + (isPlus ? 'pos' : 'neg') + '">' + (isPlus ? '+' : '−') + fmt(a.amt) + '</b></div>';
      });

      v.innerHTML =
        '<div class="card">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">' +
            '<h2>Dữ liệu từ Sheet ' + (isPlus ? 'Thưởng / Chi bù' : 'Trừ tiền') + '</h2>' +
            '<button class="btn-sm" onclick="loadCloud()">🔄 Tải lại Sheet</button>' +
          '</div>' +
          (list || '<p class="mut">Không có khoản dữ liệu nào từ Google Sheet cho ' + esc(curEmp) + ' trong tháng này.</p>') +
        '</div>';
    }
  }

  function render() {
    if (!token) return;
    renderEmps();
    renderTabs();
    renderView();
  }

  window.onload = init;
</script>
</body>
</html>
