<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Quản lý cửa hàng</title>
<style>
:root{--bg:#f4f5f7;--cd:#fff;--tx:#14171c;--mu:#6b7280;--bd:#e2e5ea;--ac:#2563eb;--acb:#dbeafe}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1115;--cd:#1a1d23;--tx:#eef0f3;--mu:#9aa1ad;--bd:#2c313a;--ac:#60a5fa;--acb:#172a4a}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
#menu{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 32px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:22px;margin:0}
button{font:inherit;cursor:pointer}
.ic{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:16px}
.tile{display:flex;align-items:center;gap:14px;padding:18px;margin-bottom:12px;background:var(--cd);border:1px solid var(--bd);border-radius:16px;color:inherit;text-decoration:none}
.tile:active{transform:scale(.98)}
.tile .e{font-size:34px}
.tile b{display:block;font-size:18px}.tile span{font-size:14px;color:var(--mu)}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.cd h3{margin:0 0 10px;font-size:15px}
input{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin-bottom:8px}
.save{width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600}
.hint{font-size:13px;color:var(--mu);margin:6px 0 0}
#app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:var(--cd);border-bottom:1px solid var(--bd)}
.bar b{font-size:16px}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
</style></head><body>
<div id="menu">
 <div class="hd"><h1>🏪 Quản lý cửa hàng</h1><button class="ic" id="gear">⚙</button></div>
 <div class="cd" id="cfg" hidden>
  <h3>Kết nối Google Apps Script</h3>
  <input id="cu" placeholder="Link Apps Script (kết thúc bằng /exec)" autocapitalize="off">
  <button class="save" id="cs">Lưu</button>
  <div class="hint">Chỉ lưu trên máy này, nhập một lần. Tính công dùng mật khẩu riêng của từng nhân viên.</div>
 </div>
 <a class="tile" href="#cong"><span class="e">👥</span><div><b>Tính công</b><span>Lương, chấm công, KPI, thưởng/trừ</span></div></a>
 <a class="tile" href="#kho"><span class="e">📦</span><div><b>Kho IMEI</b><span>Nhập, xuất, kiểm kho, tra cứu tồn</span></div></a>
 <a class="tile" href="#chi"><span class="e">💰</span><div><b>Thu chi</b><span>Ghi khoản thu chi, chụp hóa đơn</span></div></a>
</div>
<div id="app" hidden>
 <div class="bar"><button class="ic" id="bk">← Menu</button><b id="ttl"></b></div>
 <iframe id="fr" allow="camera" title="Ứng dụng"></iframe>
</div>
<script>
const $=id=>document.getElementById(id);
const APPS={cong:['👥 Tính công','cong.html'],kho:['📦 Kho IMEI','kho.html'],chi:['💰 Thu chi','chi.html']};
const cfg=()=>{try{return JSON.parse(localStorage.getItem('hub_cfg')||'{}')}catch(e){return{}}};
function route(){
  const h=location.hash.slice(1),a=APPS[h],f=$('fr');
  if(a){
    $('menu').hidden=true;$('app').hidden=false;$('ttl').textContent=a[0];
    if(f.dataset.app!==h){f.dataset.app=h;f.src=a[1]}
  }else{
    $('app').hidden=true;$('menu').hidden=false;
    if(f.dataset.app){f.dataset.app='';f.src='about:blank'}
  }
}
function fillCfg(){const c=cfg();$('cu').value=c.url||''}
$('gear').onclick=()=>{$('cfg').hidden=!$('cfg').hidden;fillCfg()};
$('cs').onclick=()=>{
  try{localStorage.setItem('hub_cfg',JSON.stringify({url:$('cu').value.trim()}))}catch(e){}
  $('cfg').hidden=true;
};
$('bk').onclick=()=>{location.hash=''};
window.addEventListener('hashchange',route);
if(!cfg().url){$('cfg').hidden=false;fillCfg()}
route();
</script></body></html>
